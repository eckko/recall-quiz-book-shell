# Opens a pull request (assigned to the repository owner) into the default
# branch whenever a feat/** branch is created or gets new commits. If the
# branch already has an open PR, nothing is done (the new commits show up in
# that PR by themselves).
#
# One-time setup: Settings > Actions > General > Workflow permissions, tick
# "Allow GitHub Actions to create and approve pull requests". Without it the
# "Open the pull request" step fails with a permissions error.
#
# Note: a PR opened with the built-in token does not start other workflows
# (a GitHub rule against loops). Nothing in this repo needs that today. If a
# check ever must run on these PRs, give the step a personal access token in
# the secret AUTO_PR_TOKEN and it will be used instead.
name: Open pull request for feat branches

on:
  push:
    branches:
      - "feat/**"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ secrets.AUTO_PR_TOKEN || github.token }}
          BRANCH: ${{ github.ref_name }}
          BASE: ${{ github.event.repository.default_branch }}
          # Who the PR is assigned to: the repository variable PR_ASSIGNEE,
          # else the repository owner.
          ASSIGNEE: ${{ vars.PR_ASSIGNEE || github.repository_owner }}
        run: |
          existing=$(gh pr list --head "$BRANCH" --base "$BASE" \
            --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "PR #$existing is already open for $BRANCH; nothing to do."
            exit 0
          fi

          ahead=$(git rev-list --count "origin/$BASE..HEAD")
          if [ "$ahead" -eq 0 ]; then
            echo "$BRANCH has no commits that $BASE lacks; no PR needed."
            exit 0
          fi

          # Title and description come from the commits (--fill): one commit
          # gives its subject and message, several give the branch name and
          # a list of the commit subjects.
          gh pr create --base "$BASE" --head "$BRANCH" --fill \
            --assignee "$ASSIGNEE"
