# Builds the encrypted book site (reader + quiz) of this book and publishes it
# into a subject site made from eckko/subject-reader-shell. Copy it to
# .github/workflows/publish-encrypted-book.yml in the private book repo and
# set the env values below.
#
# The plain book never leaves this repo: the job reads the EPUB (and your
# notes EPUB) and questions.json, encrypts everything with the subject key
# inside the runner and publishes only the small pages, book.json and
# *.enc files. The build tools and the publish script both come from
# eckko/recall-quiz-site-template at TEMPLATE_TAG (the same tag readers load
# the code from), so the subject site needs no tools of its own.
#
# One-time setup (Settings > Secrets and variables > Actions of this repo):
#   SUBJECT_REPO_TOKEN         fine-grained token for the subject repo only,
#                              "Contents: Read and write"
#   SUBJECT_KEY                the subject key: 32 bytes as 64 hex characters
#                              or base64. One key for the whole subject.
#   QUIZ_MEDIA_OLD_KEY         only if this book's media/ files were NOT made
#                              with the public "placeholder" key: their key
#                              (base64)
#   (optional variable) SUBJECT_REPO  name of the subject repo
#
# Ways to start it:
#   - a push to main that changes the book (see paths below);
#   - by hand or by a script (needs this file on the default branch):
#       gh workflow run publish-to-subject.yml \
#         -f SUBJECT_REPO=habit-reader -f TEMPLATE_TAG=3.2.5
#   - from another workflow of any repo that can see this one:
#       uses: eckko/<book>/.github/workflows/publish-to-subject.yml@main
#       with: { SUBJECT_REPO: habit-reader, TEMPLATE_TAG: 3.2.5 }
#       secrets: inherit
#
# Inputs (both optional):
#   SUBJECT_REPO  the subject site to publish into, "name" (owner eckko) or
#                 "owner/name". Default: the repository variable SUBJECT_REPO.
#   TEMPLATE_TAG  an exact template tag such as 3.2.5 (no "v", not a major
#                 like 3, never a branch): it is checked out for the build
#                 tools, so it must be a real tag. Default: the value below.
name: Publish encrypted book (reader + quiz)

on:
  push:
    branches: [main]
    paths:
      - references/**
      - questions.json
      - media/**
      - book-structure/**
      # This file's name here, and its name in the private book repos.
      - .github/workflows/publish-to-subject.yml
      - .github/workflows/publish-encrypted-book.yml
  workflow_dispatch:
    inputs:
      SUBJECT_REPO:
        description: 'Subject site to publish into: "name" or "owner/name"'
        required: false
        type: string
      TEMPLATE_TAG:
        description: "Exact template tag, for example 3.2.5"
        required: false
        type: string
  workflow_call:
    inputs:
      SUBJECT_REPO:
        description: 'Subject site to publish into: "name" or "owner/name"'
        required: false
        type: string
      TEMPLATE_TAG:
        description: "Exact template tag, for example 3.2.5"
        required: false
        type: string
    secrets:
      SUBJECT_REPO_TOKEN:
        required: false
      SUBJECT_KEY:
        required: false
      QUIZ_MEDIA_OLD_KEY:
        required: false

permissions:
  contents: read

concurrency:
  group: publish-encrypted-book
  cancel-in-progress: false

env:
  # The input (by hand, script or caller workflow) wins over the repository
  # variable. A bare name gets the owner eckko.
  SUBJECT_REPO: ${{ inputs.SUBJECT_REPO && (contains(inputs.SUBJECT_REPO, '/') && inputs.SUBJECT_REPO || format('eckko/{0}', inputs.SUBJECT_REPO)) || format('eckko/{0}', vars.SUBJECT_REPO || 'YOUR_SUBJECT_REPO') }}
  # The folder (and URL name) of the book: lower-case letters, digits, dashes.
  BOOK_FOLDER: ${{ github.event.repository.name }}
  # Leave empty for a quiz-only book (no reader).
  BOOK_EPUB: references/book.epub
  NOTES_EPUB: references/notes.epub
  # An exact tag of eckko/recall-quiz-site-template such as 3.1.0: no "v",
  # never a branch. The input TEMPLATE_TAG overrides the default after the
  # colon below.
  # NOTE: 3.2.1 cannot build this book: its EPUB has chapters in a text/ folder
  # and an "Appendix: ..." title, and add_notes.py cannot find notes files
  # for the prefixes u1..u9 / ap. Change this to the first tag that has both
  # fixes before running the workflow.
  TEMPLATE_TAG: ${{ inputs.TEMPLATE_TAG || '3.2.5' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check the setup
        id: setup
        env:
          TOKEN: ${{ secrets.SUBJECT_REPO_TOKEN }}
          KEY: ${{ secrets.SUBJECT_KEY }}
        run: |
          if [[ "$SUBJECT_REPO" == *YOUR_* || "$BOOK_EPUB" == *YOUR_* ]]; then
            echo "::notice::SUBJECT_REPO or BOOK_EPUB is not set; nothing published."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$TOKEN" ]; then
            echo "::error::The secret SUBJECT_REPO_TOKEN is missing."
            exit 1
          elif [ -z "$KEY" ]; then
            echo "::error::The secret SUBJECT_KEY is missing."
            exit 1
          elif ! [[ "$SUBJECT_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::SUBJECT_REPO must be like 'habit-reader' or 'eckko/habit-reader'."
            exit 1
          elif ! [[ "$TEMPLATE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::TEMPLATE_TAG must be an exact tag like 3.1.0 (no v, no branch)."
            exit 1
          fi

      - name: Check out this book repo
        if: steps.setup.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          path: book

      - name: Check out the subject site
        if: steps.setup.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SUBJECT_REPO }}
          token: ${{ secrets.SUBJECT_REPO_TOKEN }}
          path: subject

      - name: Check out the build tools (template at its tag)
        if: steps.setup.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: eckko/recall-quiz-site-template
          ref: ${{ env.TEMPLATE_TAG }}
          path: template

      - name: Set up Python
        if: steps.setup.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the build tools' packages
        if: steps.setup.outputs.skip != 'true'
        run: pip install beautifulsoup4 lxml cryptography

      - name: Build the encrypted site
        if: steps.setup.outputs.skip != 'true'
        env:
          SUBJECT_KEY: ${{ secrets.SUBJECT_KEY }}
          QUIZ_MEDIA_OLD_KEY: ${{ secrets.QUIZ_MEDIA_OLD_KEY }}
        run: |
          echo "::add-mask::$SUBJECT_KEY"
          args=(--book book --template-tag "$TEMPLATE_TAG" --out "$RUNNER_TEMP/site")
          if [ -n "$BOOK_EPUB" ]; then args+=(--epub "$BOOK_EPUB"); fi
          if [ -n "$NOTES_EPUB" ]; then args+=(--notes-epub "$NOTES_EPUB"); fi
          python3 template/tools/book_build/build_book.py "${args[@]}"

      - name: Publish
        if: steps.setup.outputs.skip != 'true'
        run: template/tools/site/publish_book.sh "$RUNNER_TEMP/site" "$BOOK_FOLDER" subject
